name: brew-book-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brewbook_local
      POSTGRES_USER: brewbook
      POSTGRES_PASSWORD: brewbook
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewbook -d brewbook_local"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
