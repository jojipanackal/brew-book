name: Deploy BrewBook

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_IMAGE_NAME: ghcr.io/${{ github.repository }}:latest
  NODE_ENV: production

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.APP_IMAGE_NAME }}
          secrets: |
            "dotenv_key=${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare VPS directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p /var/www/brew-book

      - name: Upload Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /var/www/brew-book

      - name: Pull and restart BrewBook
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /var/www/brew-book
            docker compose pull
            docker compose run --rm migrate
            docker compose up -d --remove-orphans app
            mkdir -p logs
            current_cron="$(crontab -l 2>/dev/null || true)"
            clean_cron="$(printf '%s\n' "$current_cron" | awk '!/brew-book poll scheduler|brew-book-morning.lock|brew-book-evening.lock|ensure-polls.ts|poll-worker/')"
            {
              printf '%s\n' "$clean_cron"
              printf '%s\n' '# brew-book poll scheduler (server timezone: UTC)'
              printf '%s\n' '59 4 * * * cd /var/www/brew-book && /usr/bin/flock -n /tmp/brew-book-morning.lock docker exec brew-book node_modules/.bin/tsx scripts/ensure-polls.ts >> /var/www/brew-book/logs/polls.log 2>&1'
              printf '%s\n' '59 8 * * * cd /var/www/brew-book && /usr/bin/flock -n /tmp/brew-book-evening.lock docker exec brew-book node_modules/.bin/tsx scripts/ensure-polls.ts >> /var/www/brew-book/logs/polls.log 2>&1'
            } | crontab -
            docker image prune -f
